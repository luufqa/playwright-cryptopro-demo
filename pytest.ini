[pytest]
; Add the project root to sys.path so Python can import pages, locators, and tools.
pythonpath = .

; Explicitly define the test directory.
testpaths = tests

filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning

markers =
    sign: Mark a signing tests to run

addopts =
    -v -s --html=reports/report.html --self-contained-html
